services:
  backend:
    env_file:
    - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USER: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_NAME: ${POSTGRES_NAME}
      CHROMADB_HOST: chromadb 
      CHROMADB_PORT: 8000
    image: backend
    container_name: backend
    ports:
    - "127.0.0.1:8010:8000"
    volumes:
    - ./.modelscope-cache:/home/appuser/.cache/modelscope
    build:
      context: .
      dockerfile: ./dockerfile
    depends_on:
      db:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  db:
    image: postgres:16
    env_file:
    - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  chromadb:
    image: chromadb/chroma:1.5.9
    volumes:
    - chromadb_data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - 'exec 3<>/dev/tcp/127.0.0.1/8000; printf "GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; read -r status <&3; [[ "$$status" == *" 200 "* ]]'
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  chromadb_data:
